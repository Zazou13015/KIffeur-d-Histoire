name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/verifier-chapitres.py --exiger-validation --exiger-cinq-partout
      - run: python3 scripts/verifier-descriptions.py --exiger-revue-documentaire
      - run: python3 scripts/test-verifier-descriptions.py
      - run: node node_modules/tsx/dist/cli.mjs --test scripts/import-descriptions.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
